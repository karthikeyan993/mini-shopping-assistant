[project]
name = "mini-shopping-assistant"
version = "0.1.0"
description = "A small shopping assistant for a sports store: hybrid search, tools, guardrails, evals. Built to learn AI engineering."
requires-python = ">=3.11"
dependencies = [
    "openai>=1.40",      # one client for Gemini (OpenAI-compatible endpoint), Ollama, vLLM, LiteLLM
    "pydantic>=2.6",     # validate what the model returns
    "numpy>=1.26",       # vector maths
    "pythainlp>=5.0",    # Thai word segmentation for keyword search
    "scikit-learn>=1.9.1",
    "pypdf>=7.1.1",
    "pillow>=13.0.0",
    "pypdfium2>=5.15.2",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
samples = [
    "fpdf2>=2.9.0",
]

[project.scripts]
shop = "shop.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/shop"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
